sources:
  - kind: source
    name: prod_spanner

tools:
  - kind: tool
    name: get_user_by_id
    source: prod_spanner
    mapped_tool: execute_sql_readonly
    description: Retrieve a user record by their unique ID
    inputs:
      sql: SELECT UserId, Name, Email FROM Users WHERE UserId = @user_id
      parameters:
        - name: user_id
          type: string
          description: The user's unique ID
          required: true
          mapped_value: {name: "user_id", type: {code: STRING}, value: "${user_id}"}

  - kind: tool
    name: list_orders_by_status
    source: prod_spanner
    mapped_tool: execute_sql_readonly
    description: List recent orders for a customer filtered by status
    inputs:
      sql: >
        SELECT OrderId, Status, TotalAmount, CreatedAt
        FROM Orders
        WHERE CustomerId = @customer_id AND Status = @status
        ORDER BY CreatedAt DESC LIMIT @limit
      parameters:
        - name: customer_id
          type: string
          description: Customer's unique ID
          required: true
          mapped_value: {name: "customer_id", type: {code: STRING}, value: "${customer_id}"}
        - name: status
          type: string
          description: "Order status (PENDING, CONFIRMED, SHIPPED, DELIVERED)"
          required: false
          default: PENDING
          mapped_value: {name: "status", type: {code: STRING}, value: "${status}"}
        - name: limit
          type: integer
          description: Maximum number of results
          required: false
          default: 10
          mapped_value: {name: "limit", type: {code: INT64}, value: "${limit}"}

  - kind: tool
    name: update_order_status
    source: prod_spanner
    mapped_tool: execute_sql
    description: Update the status of an existing order
    inputs:
      sql: "UPDATE Orders SET Status = @new_status WHERE OrderId = @order_id"
      parameters:
        - name: order_id
          type: string
          description: The order ID to update
          required: true
          mapped_value: {name: "order_id", type: {code: STRING}, value: "${order_id}"}
        - name: new_status
          type: string
          description: "New status (CONFIRMED, SHIPPED, DELIVERED, CANCELLED)"
          required: true
          mapped_value: {name: "new_status", type: {code: STRING}, value: "${new_status}"}

toolsets:
  - kind: toolset
    name: order_management
    tools:
      - get_user_by_id
      - list_orders_by_status
      - update_order_status
