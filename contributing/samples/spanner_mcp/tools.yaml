sources:
  - kind: source
    name: prod_spanner

tools:
  - kind: tool
    name: create_session
    source: prod_spanner
    mapped_tool: create_session
    description: >
      Create a Spanner session for the configured database. Must be called once
      before running any queries. Returns a session name to pass to query tools.
    inputs:
      database: "projects/${SPANNER_PROJECT}/instances/${SPANNER_INSTANCE}/databases/${SPANNER_DATABASE}"

  - kind: tool
    name: get_user_by_id
    source: prod_spanner
    mapped_tool: execute_sql_readonly
    description: Retrieve a user record by their unique ID
    inputs:
      session:
        type: string
        description: Session name returned by create_session
        required: true
      sql: SELECT UserId, Name, Email FROM Users WHERE UserId = @user_id
      parameters:
        - name: user_id
          type: string
          description: The user's unique ID
          required: true
          mapped_value: {name: "user_id", type: {code: STRING}, value: "${user_id}"}

  - kind: tool
    name: list_orders_by_status
    source: prod_spanner
    mapped_tool: execute_sql_readonly
    description: List recent orders for a customer filtered by status
    inputs:
      session:
        type: string
        description: Session name returned by create_session
        required: true
      sql: >
        SELECT OrderId, Status, TotalAmount, CreatedAt
        FROM Orders
        WHERE CustomerId = @customer_id AND Status = @status
        ORDER BY CreatedAt DESC LIMIT @limit
      parameters:
        - name: customer_id
          type: string
          description: Customer's unique ID
          required: true
          mapped_value: {name: "customer_id", type: {code: STRING}, value: "${customer_id}"}
        - name: status
          type: string
          description: "Order status (PENDING, CONFIRMED, SHIPPED, DELIVERED)"
          required: false
          default: PENDING
          mapped_value: {name: "status", type: {code: STRING}, value: "${status}"}
        - name: limit
          type: integer
          description: Maximum number of results
          required: false
          default: 10
          mapped_value: {name: "limit", type: {code: INT64}, value: "${limit}"}

toolsets:
  - kind: toolset
    name: order_management
    tools:
      - create_session
      - get_user_by_id
      - list_orders_by_status
